# Konfigurasi bersama semua profile. Nilai rahasia dan yang beda per mesin
# dibaca dari environment variable (lihat .env.example).
spring:
  application:
    name: templateapp
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    # Struktur tabel hanya diubah lewat Flyway; Hibernate cukup mencocokkan Entity dengan tabel.
    hibernate:
      ddl-auto: validate
    # Matikan agar query database tidak diam-diam berjalan saat JSON sedang ditulis ke response.
    open-in-view: false

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:30}
  google:
    web-client-id: ${GOOGLE_WEB_CLIENT_ID:}
  github:
    client-id: ${GITHUB_CLIENT_ID:}
    client-secret: ${GITHUB_CLIENT_SECRET:}
    redirect-uri: ${GITHUB_REDIRECT_URI:http://localhost:8080/api/auth/github/callback}
  deep-link: ${APP_DEEP_LINK:templateapp://auth/callback}
  timezone: ${APP_TIMEZONE:Asia/Jakarta}
  seed:
    # Seeder demo template provider (hanya profile dev). Mati secara bawaan; nyalakan dengan
    # --app.seed.demo-templates=true saat menjalankan backend. Lihat README "Data demo provider".
    demo-templates: false
  # Fitur Upload provider (docs/rancangan/alur-fitur-upload.md). Semua angka dan daftar di sini bisa diubah
  # tanpa update app Android; setelah diubah cukup restart backend.
  upload:
    # Folder ZIP & paket template. backend/uploads/ sudah ada di .gitignore.
    storage-dir: ${UPLOAD_STORAGE_DIR:uploads}
    limits:                               # bagian 5.7a
      max-zip-bytes: 20971520             # 20 MB (Error)
      max-extracted-bytes: 52428800       # 50 MB setelah diekstrak (Error, mencegah zip bomb)
      max-files: 500                      # Error
      max-file-bytes: 10485760            # 10 MB per file (Error)
      image-warn-bytes: 1048576           # 1 MB per gambar (Peringatan)
      page-warn-bytes: 5242880            # 5 MB total berat satu halaman (Peringatan)
      max-pages: 10                       # halaman HTML (Error)
      css-warn-bytes: 1048576             # 1 MB per file CSS (Peringatan)
      base64-warn-bytes: 20480            # gambar base64 di HTML > 20 KB (Peringatan)
      js-body-min-text-chars: 50          # "konten utama dibuat JS" jika teks body < 50 karakter ...
      js-body-min-images: 1               # ... dan gambar < 1
      min-editable-elements: 3            # kasus ekstrem: kurang dari 3 teks/gambar di seluruh template
    chunk-size-bytes: 1048576             # upload per potongan 1 MB (bagian 5.7b)
    draft-limit: 5                        # alur-provider.md bagian 5.4
    draft-expire-days: 30
    draft-warn-days: 5                    # pemberitahuan dikirim 5 hari sebelum draft dihapus
    session-expire-hours: 24              # sesi upload yang tidak selesai dibersihkan setelah 24 jam
    # CDN terpercaya (bagian 10.4). Google Fonts ditangani terpisah (boleh, Peringatan kecil).
    trusted-cdn-hosts:
      - cdn.jsdelivr.net
      - cdnjs.cloudflare.com
      - unpkg.com
      - cdn.tailwindcss.com
      - code.jquery.com
    # Library yang boleh dimuat dari CDN. "packages" = nama paket di jsDelivr/unpkg (npm) atau cdnjs.
    allowed-libraries:
      - { name: Tailwind, packages: [tailwindcss, "@tailwindcss/browser"] }
      - { name: Bootstrap, packages: [bootstrap, twitter-bootstrap] }
      - { name: Bulma, packages: [bulma] }
      - { name: Alpine.js, packages: [alpinejs, "@alpinejs/collapse", "@alpinejs/intersect", "@alpinejs/focus"] }
      - { name: jQuery, packages: [jquery] }
      - { name: AOS, packages: [aos] }
      - { name: Swiper, packages: [swiper, Swiper] }
      - { name: Splide, packages: ["@splidejs/splide", splidejs] }
      - { name: GSAP, packages: [gsap] }
      - { name: Font Awesome, packages: ["@fortawesome/fontawesome-free", font-awesome] }
      - { name: Bootstrap Icons, packages: [bootstrap-icons] }
      - { name: Lucide, packages: [lucide, lucide-static] }
      - { name: Remix Icon, packages: [remixicon, remix-icon] }
    # File library terkenal yang disertakan di ZIP; dikenali dari SHA-256 sehingga tidak dipindai ulang.
    # Tambah baris baru dengan: curl -sL <url-file> | sha256sum
    known-libraries:
      - { name: Alpine.js, version: 3.14.1, sha256: 358d9afbb1ab5befa2f48061a30776e5bcd7707f410a606ba985f98bc3b1c034 }
      - { name: jQuery, version: 3.7.1, sha256: fc9a93dd241f6b045cbff0481cf4e1901becd0e12fb45166a8f17f95823f0b1a }
      - { name: Bootstrap JS, version: 5.3.3, sha256: 0833b2e9c3a26c258476c46266e6877fc75218625162e0460be9a3a098a61c6c }
      - { name: AOS, version: 2.3.4, sha256: a5005b2e414770fd5ccb40bc221a12771966d02b5c1f9c89da48bd8e3811d377 }
      - { name: GSAP, version: 3.12.5, sha256: 28033e449a31ebcc396e5be8b13b63152bf03094288fb5867034321927bce087 }
      - { name: Swiper, version: 11.1.4, sha256: ac20020d60a9fd5cc8874aec07e8a940233d5c1bcef0735ed1f35239ae2ccacd }
      - { name: Splide, version: 4.1.4, sha256: 159b16ec7d95e57f531a29d28e3c18278d7d5e46b6ec8f173c3996af21a55adc }
    # iframe yang boleh (bagian 5.6 E: YouTube & Google Maps): host, atau host + awalan path.
    iframe-allowed:
      - www.youtube.com
      - youtube.com
      - www.youtube-nocookie.com
      - www.google.com/maps
      - maps.google.com
    # Analytics/pelacak: dicocokkan dengan host script dan isi JavaScript.
    tracker-patterns:
      - googletagmanager.com
      - google-analytics.com
      - connect.facebook.net
      - static.hotjar.com
      - clarity.ms
      - "gtag("
      - "fbq("
      - "hj("
      - "_paq.push"
    # SDK yang mengambil data dari server (template harus statis).
    remote-data-patterns:
      - gstatic.com/firebasejs
      - firebase
      - supabase
