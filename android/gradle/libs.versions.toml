# Version catalog: daftar SEMUA library & plugin beserta versinya di satu tempat.
# File build (build.gradle.kts) cukup menulis libs.<nama>, mis. libs.retrofit atau libs.plugins.hilt.
# Tanda "-" di nama berubah menjadi "." saat dipakai: "androidx-appcompat" → libs.androidx.appcompat.
# Versi dicek dari Google Maven & Maven Central (stabil terbaru), dicatat juga di README.

[versions]
agp = "9.4.1"
appcompat = "1.8.0"
material = "1.14.0"
constraintlayout = "2.2.2"
activity = "1.13.0"
fragment = "1.9.1"
navigation = "2.10.2"
lifecycle = "2.11.0"
core = "1.19.1"
splashscreen = "1.2.0"
viewpager2 = "1.1.0"
hilt = "2.60.1"
retrofit = "3.0.0"
okhttp = "5.5.0"
gson = "2.14.0"
credentials = "1.6.0"
googleid = "1.2.1"
browser = "1.10.0"
lottie = "6.7.1"
room = "2.8.5"
webkit = "1.17.1"
junit = "4.13.2"
coreTesting = "2.2.0"
androidxJunit = "1.3.0"
espresso = "3.7.0"

[libraries]
# Bentuk: nama = { group = "...", name = "...", version.ref = "<kunci di [versions]>" }
androidx-core = { group = "androidx.core", name = "core", version.ref = "core" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
androidx-activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
androidx-fragment = { group = "androidx.fragment", name = "fragment", version.ref = "fragment" }
androidx-navigation-fragment = { group = "androidx.navigation", name = "navigation-fragment", version.ref = "navigation" }
androidx-navigation-ui = { group = "androidx.navigation", name = "navigation-ui", version.ref = "navigation" }
androidx-lifecycle-viewmodel = { group = "androidx.lifecycle", name = "lifecycle-viewmodel", version.ref = "lifecycle" }
androidx-lifecycle-livedata = { group = "androidx.lifecycle", name = "lifecycle-livedata", version.ref = "lifecycle" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "splashscreen" }
androidx-viewpager2 = { group = "androidx.viewpager2", name = "viewpager2", version.ref = "viewpager2" }
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-converter-gson = { group = "com.squareup.retrofit2", name = "converter-gson", version.ref = "retrofit" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
androidx-credentials = { group = "androidx.credentials", name = "credentials", version.ref = "credentials" }
androidx-credentials-play-services = { group = "androidx.credentials", name = "credentials-play-services-auth", version.ref = "credentials" }
googleid = { group = "com.google.android.libraries.identity.googleid", name = "googleid", version.ref = "googleid" }
androidx-browser = { group = "androidx.browser", name = "browser", version.ref = "browser" }
lottie = { group = "com.airbnb.android", name = "lottie", version.ref = "lottie" }
# Room: database SQLite di HP untuk daftar project (offline). room-compiler membuat kode DAO saat compile.
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
# WebViewAssetLoader: menampilkan file template hasil ekstrak ZIP di WebView tanpa akses file:// (Upload, AGENTS 17).
androidx-webkit = { group = "androidx.webkit", name = "webkit", version.ref = "webkit" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-arch-core-testing = { group = "androidx.arch.core", name = "core-testing", version.ref = "coreTesting" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxJunit" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
