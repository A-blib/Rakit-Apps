# Profile untuk test otomatis. Database disediakan Testcontainers, bukan PostgreSQL laptop.
app:
  auth:
    # Semua test login dari 127.0.0.1 dalam satu konteks Spring; batas per IP diuji di AttemptLimiterTest.
    login-max-per-ip: 100000
  jwt:
    # Hanya untuk test; bukan rahasia sungguhan.
    secret: test-secret-yang-panjangnya-minimal-32-byte-untuk-hs256
  # Nilai palsu: verifikasi Google & panggilan ke GitHub diganti mock di test.
  google:
    web-client-id: test-web-client-id
  github:
    client-id: test-github-client-id
    client-secret: test-github-client-secret
  upload:
    # ZIP test ditulis ke folder build, bukan ke backend/uploads/ milik backend dev.
    storage-dir: target/test-uploads
    # Potongan kecil agar test bisa mencoba upload yang dilanjutkan dengan ZIP uji berukuran puluhan KB.
    chunk-size-bytes: 65536
  org:
    # Logo test ditulis ke folder build, bukan ke backend/data/ milik backend dev.
    logo-dir: target/test-org-logos
  landing:
    # Gambar hero test ditulis ke folder build, bukan ke backend/data/ milik backend dev.
    image-dir: target/test-landing
  users:
    # Foto profil test ditulis ke folder build, bukan ke backend/data/ milik backend dev.
    avatar-dir: target/test-user-avatars
  projects:
    # Gambar website test ditulis ke folder build, bukan ke backend/data/ milik backend dev.
    assets-dir: target/test-project-assets
  sites:
    domain: localhost:8080
    url-scheme: http
    max-per-org: 5
    max-per-personal: 5
    root-dir: target/test-sites
